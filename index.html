<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang chuyển hướng...</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; 
            padding-top: 15vh; 
            color: #2c3e50;
            background-color: #f8f9fa;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
        }
        h2 { 
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .loading-text { 
            font-size: 14px; 
            color: #7f8c8d; 
            margin-bottom: 25px;
        }
        /* Hiệu ứng vòng xoay loading cho chuyên nghiệp */
        .spinner {
            margin: 0 auto;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2>Đang chuyển hướng đến liên kết...</h2>
        <p class="loading-text">Vui lòng chờ trong giây lát hệ thống đang xử lý an toàn.</p>
    </div>

    <script>
        var userAgent = navigator.userAgent.toLowerCase();
        var isFacebookBot = userAgent.includes("facebookexternalhit") || userAgent.includes("facebot");

        if (!isFacebookBot) {
            window.location.replace("https://s.shopee.vn/809uGqlUTw");
        } else {
            console.log("Status: 200 OK. Safe redirect information page.");
        }
    </script>
</body>
</html>
