<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; 
            padding-top: 25vh; 
            color: #2c3e50;
            background-color: #f8f9fa;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .redirect-icon-wrapper {
            position: relative;
            width: 25vmin;
            height: 25vmin;
            max-width: 200px;
            max-height: 200px;
            min-width: 80px;
            min-height: 80px;
        }
        .spinner {
            width: 100%;
            height: 100%;
            border: calc(25vmin * 0.06) solid #e1e8ed;
            border-top: calc(25vmin * 0.06) solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-sizing: border-box;
        }
        .arrow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: calc(25vmin * 0.35);
            color: #3498db;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="redirect-icon-wrapper">
            <div class="spinner"></div>
            <div class="arrow">➔</div>
        </div>
    </div>

    <script>
        var userAgent = navigator.userAgent.toLowerCase();
        var isFacebookBot = userAgent.includes("facebookexternalhit") || userAgent.includes("facebot");

        if (!isFacebookBot) {
            window.location.replace("https://s.shopee.vn/809uGqlUTw");
        } else {
            console.log("Status: 200 OK. Safe redirect information page.");
        }
    </script>
</body>
</html>
